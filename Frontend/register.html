<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Connecto</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="auth.css"
    >
</head>

<body>

<main class="authPage">

    <section class="authBrand">

        <a
            class="authLogo"
            href="login.html"
        >
            <span class="authLogoMark">C</span>
            <span>Connecto</span>
        </a>

        <div class="brandMessage">
            <span class="eyebrow">Join Connecto</span>
            <h1>Build your space.</h1>
            <p>
                Create your account and start connecting
                with people who matter to you.
            </p>
        </div>

    </section>


    <section class="authFormSide">

        <div class="authCard">

            <div class="mobileLogo">
                <span class="authLogoMark">C</span>
                <span>Connecto</span>
            </div>

            <div class="authHeading">
                <p class="smallTitle">Get started</p>
                <h2>Create your account</h2>
                <p>Enter your basic account details.</p>
            </div>


            <form id="registerForm">

                <div class="formGroup">
                    <label for="registerName">Full name</label>
                    <div class="inputBox">
                        <i class="fa-regular fa-user"></i>
                        <input
                            id="registerName"
                            type="text"
                            placeholder="Your full name"
                            required
                        >
                    </div>
                </div>


                <div class="formGroup">
                    <label for="registerUsername">Username</label>
                    <div class="inputBox">
                        <i class="fa-solid fa-at"></i>
                        <input
                            id="registerUsername"
                            type="text"
                            placeholder="Choose a username"
                            required
                        >
                    </div>
                </div>


                <div class="formGroup">
                    <label for="registerEmail">Email</label>
                    <div class="inputBox">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                            id="registerEmail"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>
                </div>


                <div class="formGroup">
                    <label for="registerPassword">Password</label>
                    <div class="inputBox">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            id="registerPassword"
                            type="password"
                            placeholder="At least 6 characters"
                            required
                        >
                    </div>
                </div>


                <div
                    id="registerMessage"
                    class="authMessage hidden"
                ></div>


                <button
                    id="registerButton"
                    class="authPrimaryButton"
                    type="submit"
                >
                    Create Account
                </button>


                <p class="accountText">
                    Already have an account?
                    <a href="login.html">
                        Sign in
                    </a>
                </p>

            </form>

        </div>

    </section>

</main>

<script src="api.js"></script>
<script src="register.js"></script>

</body>
</html>
